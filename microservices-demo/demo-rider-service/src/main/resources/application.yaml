spring:
  application:
    name: demo-rider-service

  datasource:
    url: jdbc:mysql://localhost:3306/demo-rider
    username: root
    password: blackhat

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  cloud:
    discovery:
      client:
        simple:
          instances:
            order-service:
              - uri: http://localhost:8080
              - uri: http://localhost:8082
              - uri: http://localhost:8083

server:
  port: 8081
